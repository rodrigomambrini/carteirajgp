name: Update portfolio data

on:
  schedule:
    # Every 15 min, 13:00-21:00 UTC = 10:00-18:00 America/Sao_Paulo, Mon-Fri
    # (NYSE session). This is what makes a page refresh show near-live prices:
    # the browser can't fetch Yahoo directly (no CORS headers) and public CORS
    # proxies rate-limit within minutes, so the JSON this job commits is the
    # freshness ceiling. GitHub often delays scheduled runs under load, so
    # treat ~15 min as a floor, not a guarantee.
    - cron: "*/15 13-21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch prices and recompute portfolio metrics
        run: python scripts/fetch_and_compute.py

      - name: Commit data/portfolio_data.json if it changed
        run: |
          git config user.name "carteira-jgp-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- data/portfolio_data.json; then
            echo "No changes to data/portfolio_data.json"
            exit 0
          fi
          git add data/portfolio_data.json
          git commit -m "Update portfolio data ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push
